<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Configurações | AssisTech</title>

    <link
        rel="icon"
        type="image/png"
        href="./logo.png"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>


<header class="header">

    <div class="container nav">

        <a href="dashboard.html" class="logo">

            <img
                src="./logo.png"
                alt="Logo AssisTech"
            >

            <span>
                Assis<span>Tech</span>
            </span>

        </a>


        <nav class="menu">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="chamados.html">
                Chamados
            </a>

            <a href="andamento.html">
                Andamento
            </a>

            <a
                href="configuracoes.html"
                class="active"
            >
                Configurações
            </a>

        </nav>


        <button
            class="btn-sair"
            id="btnSair"
        >
            Sair
        </button>

    </div>

</header>


<main class="dashboard">

    <div class="container">


        <section class="dashboard-welcome">

            <div>

                <p class="dashboard-subtitle">
                    CONTA
                </p>

                <h1>
                    Configurações
                </h1>

                <p>
                    Gerencie suas informações pessoais.
                </p>

            </div>

        </section>


        <section class="dashboard-box">

            <div class="box-title">

                <h2>
                    Meus dados
                </h2>

            </div>


            <form id="configForm">


                <div class="form-group">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        disabled
                    >

                </div>


                <button
                    type="submit"
                    class="btn-primary"
                >
                    Salvar alterações
                </button>


            </form>

        </section>


        <section
            class="dashboard-box"
            style="margin-top: 20px;"
        >

            <div class="box-title">

                <h2>
                    Segurança
                </h2>

            </div>


            <form id="senhaForm">


                <div class="form-group">

                    <label for="senhaAtual">
                        Senha atual
                    </label>

                    <input
                        type="password"
                        id="senhaAtual"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="novaSenha">
                        Nova senha
                    </label>

                    <input
                        type="password"
                        id="novaSenha"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmarSenha">
                        Confirmar nova senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-primary"
                >
                    Alterar senha
                </button>


            </form>

        </section>


    </div>

</main>


<footer>

    <div class="container footer-content">

        <div class="logo">

            <img
                src="./logo.png"
                alt="Logo AssisTech"
            >

            <span>
                Assis<span>Tech</span>
            </span>

        </div>


        <p>
            © 2026 AssisTech — Projeto TCC SENAI
        </p>

    </div>

</footer>


<script>


/* =========================
   USUÁRIO
========================= */

const emailAtual =
    localStorage.getItem(
        "assistTechCurrentUser"
    );


if (!emailAtual) {

    window.location.href =
        "login.html";

}


let usuarios =
    JSON.parse(
        localStorage.getItem(
            "assistTechUsers"
        )
    ) || {};


const usuario =
    usuarios[emailAtual];


if (!usuario) {

    window.location.href =
        "login.html";

}


/* =========================
   PREENCHER DADOS
========================= */

document.getElementById(
    "nome"
).value =
    usuario.nome;


document.getElementById(
    "email"
).value =
    usuario.email;


/* =========================
   ALTERAR NOME
========================= */

document
    .getElementById("configForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const novoNome =
                document
                    .getElementById("nome")
                    .value
                    .trim();


            if (novoNome.length < 3) {

                alert(
                    "Digite um nome válido."
                );

                return;

            }


            usuario.nome =
                novoNome;


            usuarios[emailAtual] =
                usuario;


            localStorage.setItem(
                "assistTechUsers",
                JSON.stringify(usuarios)
            );


            localStorage.setItem(
                "assistTechCurrentName",
                novoNome
            );


            alert(
                "Nome atualizado com sucesso!"
            );

        }
    );


/* =========================
   ALTERAR SENHA
========================= */

document
    .getElementById("senhaForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const senhaAtual =
                document
                    .getElementById("senhaAtual")
                    .value;


            const novaSenha =
                document
                    .getElementById("novaSenha")
                    .value;


            const confirmarSenha =
                document
                    .getElementById("confirmarSenha")
                    .value;


            if (senhaAtual !== usuario.senha) {

                alert(
                    "A senha atual está incorreta."
                );

                return;

            }


            if (novaSenha.length < 6) {

                alert(
                    "A nova senha precisa ter pelo menos 6 caracteres."
                );

                return;

            }


            if (novaSenha !== confirmarSenha) {

                alert(
                    "As novas senhas não coincidem."
                );

                return;

            }


            usuario.senha =
                novaSenha;


            usuarios[emailAtual] =
                usuario;


            localStorage.setItem(
                "assistTechUsers",
                JSON.stringify(usuarios)
            );


            alert(
                "Senha alterada com sucesso!"
            );


            this.reset();

        }
    );


/* =========================
   SAIR
========================= */

document
    .getElementById("btnSair")
    .addEventListener(
        "click",
        function() {

            localStorage.removeItem(
                "assistTechCurrentUser"
            );

            localStorage.removeItem(
                "assistTechCurrentName"
            );

            window.location.href =
                "login.html";

        }
    );

</script>


</body>

</html>
